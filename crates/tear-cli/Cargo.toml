[package]
name = "tear-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Archive utility for Windows"

[[bin]]
name = "tear"
path = "src/main.rs"

# Same commands without a console window, for File Explorer's context menu.
[[bin]]
name = "tearw"
path = "src/tearw.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
tear-core = { path = "../tear-core", version = "=0.1.0-dev" }
serde_json = "1"
# Already in the dependency tree via tear-core; used for tearw's message box.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
